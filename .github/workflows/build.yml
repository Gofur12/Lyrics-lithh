name: Build LyricsFlow Mod and Android Companion
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools\nplatforms;android-35\nbuild-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"
      - name: Build Fabric mod and Android companion
        run: gradle build :companion:assembleDebug
      - name: Upload Fabric JAR
        uses: actions/upload-artifact@v4
        with:
          name: lyricsflow-fabric-1.20.1
          path: build/libs/*.jar
      - name: Upload Android companion APK
        uses: actions/upload-artifact@v4
        with:
          name: lyricsflow-android-companion-debug
          path: companion/build/outputs/apk/debug/*.apk
